    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchDescriptor = {
            configurable: true,
            enumerable: true,
            get: function() {
              return originalFetch;
            },
            set: function(val) {
              originalFetch = val;
            }
          };

          try {
            Object.defineProperty(window, 'fetch', fetchDescriptor);
          } catch (e) {}

          try {
            if (window.Window && window.Window.prototype) {
              Object.defineProperty(window.Window.prototype, 'fetch', fetchDescriptor);
            }
          } catch (e) {}
        } catch (e) {}

        // Global safeguard against Chrome extension interceptor crashes
        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            (event.message.indexOf('fetch of #<Window>') !== -1 ||
             event.message.indexOf('chrome-extension://') !== -1 ||
             (event.filename && event.filename.indexOf('chrome-extension://') !== -1))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event &&
            event.reason &&
            event.reason.message &&
            event.reason.message.indexOf('fetch of #<Window>') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
